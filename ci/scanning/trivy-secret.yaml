# Trivy secret detection rules for TruthLens Pipeline
# Extends trivy's built-in ruleset with pipeline-specific patterns

rules:
  - id: anthropic-api-key
    category: "API Key"
    title: "Anthropic API Key"
    severity: CRITICAL
    regex: "sk-ant-[a-zA-Z0-9\\-]{20,}"
    keywords:
      - "sk-ant"

  - id: tavily-api-key
    category: "API Key"
    title: "Tavily API Key"
    severity: HIGH
    regex: "tvly-[a-zA-Z0-9\\-]{20,}"
    keywords:
      - "tvly-"

  - id: env-file-with-keys
    category: "Configuration"
    title: ".env file containing real API keys"
    severity: CRITICAL
    path: ".env"
    regex: "(ANTHROPIC|TAVILY|OPENAI)_API_KEY\\s*=\\s*[^\\$][a-zA-Z0-9\\-_]{15,}"
    keywords:
      - "_API_KEY="
