projectId: pipeline-d4819c1a
includePaths:
  - '**/*.py'
  - tests/**
  - pyproject.toml
  - requirements.txt
  - requirements*.txt
  - setup.cfg
excludePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - .env
  - .env.*
  - '**/*.key'
  - '**/*.pem'
  - '**/.venv/**'
  - '**/venv/**'
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
denyIfPresentAfterCopy:
  - .env
  - .git
allowedReadPaths:
  - '**/*.py'
  - tests/**
  - pyproject.toml
  - requirements.txt
  - requirements*.txt
  - setup.cfg
  - .powerplant/POLICY.yaml
  - .powerplant/VERIFY.yaml
  - README.md
allowedWritePaths:
  - tests/POWERPLANT_AUDIT.md
