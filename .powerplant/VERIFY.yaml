# VERIFY.yaml — check execution constraints:
#
#   Commands run as plain subprocesses (no shell). The command string is split on
#   whitespace — e.g. "npm test" → ["npm", "test"]. Shell features are NOT
#   supported: no &&, ||, pipes, redirection, quoting, or expansion.
#
#   Only PATH is forwarded to the subprocess. Tools must be installed system-wide
#   (e.g. npm, python3, go, cargo). Shell builtins like "source" will not work.
#   Use "python3 -m pytest" instead of bare "pytest" for portability.
#
#   required: true (default) — check must pass; failure blocks project_finalize.
#   required: false          — advisory only; runs and records but does not block.
#
# ML DEPENDENCY NOTE:
#   sentence-transformers and langgraph require venv activation. Powerplant VERIFY
#   runs checks as plain subprocesses with no venv, so tests that import engine.py
#   or zeitgeist.py (which load SentenceTransformer at module level) will fail
#   collection. tests-pure excludes those three files and covers 354/394 tests.
#   tests-full is advisory only; it requires: source .venv/bin/activate first,
#   which VERIFY cannot do — run manually via: source .venv/bin/activate && pytest

checks:
  # Compile all Python source files, excluding sub-projects and runtime dirs.
  # The -x flag accepts a Python regex applied to each path; | is alternation.
  syntax-check:
    command: python3 -m compileall -q . -x \.venv|scp|agent_sandbox|truthlens|__pycache__
    required: true

  # 354 tests that have no ML-package dependency at import time.
  # test_adapters.py, test_novelty.py, and test_regression_main.py all import
  # engine.py or zeitgeist.py at module load, which pulls in sentence_transformers.
  tests-pure:
    command: python3 -m pytest --ignore=tests/test_adapters.py --ignore=tests/test_novelty.py --ignore=tests/test_regression_main.py
    required: true

  # Static import graph analysis — constitutional CI gate.
  # Exits 0 even when OPA is absent (advisory warnings only), but catches
  # hard import-graph violations when OPA is available.
  import-graph:
    command: python3 ci/scripts/check_imports.py
    required: false

  # HIGH-severity security scan of source (excludes sub-projects).
  # Currently exits 0 (no HIGH findings). Bandit emits deprecation warnings for
  # non-raw regex escape sequences in signals.py — those are quality issues, not
  # security findings. Required; will block finalize if HIGH issues are introduced.
  bandit-security:
    command: bandit -r . --exclude .venv,scp,agent_sandbox,truthlens -lll -q
    required: true

  # Full test suite including ML-dep tests. Cannot run without venv.
  # Powerplant cannot activate .venv — run manually to verify ML-path tests.
  tests-full:
    command: python3 -m pytest
    required: false
