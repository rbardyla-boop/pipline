# microsandbox configuration for TruthLens Pipeline
# Reference: microsandbox/microsandbox
#
# Provides per-execution hardware-level isolation for pipeline runs.
# Each invocation of main.py gets an isolated sandbox instance.

[sandbox]
name = "truthlens-pipeline"
description = "Epistemic sandbox for deterministic concept evolution pipeline"

[sandbox.isolation]
# Filesystem: read-only root, only /tmp and /app/logs are writable
read_only_root = true
writable_paths = ["/tmp", "/app/logs/runs", "/app/logs/audit"]

# User: run as nobody (uid=65534), no privilege escalation
uid = 65534
gid = 65534
no_new_privileges = true

# Network: proxy-only — all egress routed through gateway
network_mode = "proxy_only"
proxy_host = "gateway"
proxy_port = 8080
# Block all direct outbound connections except to proxy
allowed_outbound = ["gateway:8080"]
denied_outbound_default = true

# Resources
[sandbox.resources]
max_memory_mb = 1024
max_cpu_percent = 200   # 2 cores
max_disk_mb = 512       # For /tmp and log writes
max_open_files = 256
max_processes = 32
timeout_seconds = 600   # 10 minutes max per run

# Syscall filtering (seccomp BPF)
[sandbox.seccomp]
# Default action: allow
# Deny list — high-risk syscalls blocked
denied_syscalls = [
    "mount",
    "umount2",
    "pivot_root",
    "clone",          # Block namespace creation (container escape vector)
    "unshare",
    "setuid",
    "setgid",
    "setreuid",
    "setregid",
    "chroot",
    "ptrace",         # Block debugging/injection
    "process_vm_readv",
    "process_vm_writev",
    "kcmp",
    "kexec_load",
    "perf_event_open",
    "bpf",            # Block BPF program loading
]

# Linux capabilities
[sandbox.capabilities]
# Drop ALL capabilities, add none back
drop_all = true
add = []   # No capabilities granted

# Audit
[sandbox.audit]
enabled = true
log_path = "/app/logs/audit/sandbox-events.jsonl"
# Log: exec events, network connections, file opens (for /app/logs only)
log_exec = true
log_network = true
log_file_opens = false  # Too noisy; only log violations
log_violations = true

# Environment
[sandbox.env]
# Variables passed into sandbox (no credentials)
allowed = [
    "GATEWAY_URL",
    "NOVELTY_THRESHOLD",
    "ARCHIVE_MAX",
    "EMBEDDING_MODEL",
    "STRICT_NODE_GOVERNANCE",
    "PYTHONPATH",
    "PYTHONDONTWRITEBYTECODE",
    "PYTHONUNBUFFERED",
    "EPHEMERAL_GATE",
    "TERMINAL_ARCHIVE_PATH",
    "HOME",
    "PATH",
    "LANG",
    "LC_ALL",
]
# Explicitly deny credential vars (belt-and-suspenders)
denied = [
    "ANTHROPIC_API_KEY",
    "TAVILY_API_KEY",
    "AWS_ACCESS_KEY_ID",
    "AWS_SECRET_ACCESS_KEY",
    "GOOGLE_API_KEY",
]
