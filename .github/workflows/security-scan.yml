name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC to catch new CVEs
    - cron: "0 6 * * *"

jobs:
  dependency-scan:
    name: "Trivy — Python Deps + Secrets"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan (deps + secrets)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: ".venv,__pycache__,node_modules,.git"
          trivyignores: ".trivyignore"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  container-scan:
    name: "Trivy — Docker Image"
    runs-on: ubuntu-latest
    needs: dependency-scan
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: docker build -f docker/Dockerfile -t pipline:ci .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "image"
          image-ref: "pipline:ci"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload image scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image.sarif"

  static-analysis:
    name: "Static Security Analysis (claude-code-security-review patterns)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r . \
            --exclude .venv,__pycache__,node_modules \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o logs/bandit-results.json || true
          # Parse for HIGH severity issues — fail if any
          python - <<'EOF'
          import json, sys
          try:
              with open("logs/bandit-results.json") as f:
                  results = json.load(f)
              high = [r for r in results.get("results", []) if r.get("issue_severity") == "HIGH"]
              if high:
                  print(f"FAIL: {len(high)} HIGH severity bandit finding(s):")
                  for r in high:
                      print(f"  {r['filename']}:{r['line_number']} — {r['issue_text']}")
                  sys.exit(1)
              print(f"PASS: No HIGH severity issues ({len(results.get('results', []))} total findings)")
          except FileNotFoundError:
              print("PASS: bandit results not found (no Python files scanned)")
          EOF

      - name: Check for direct Anthropic client instantiation outside security layer
        run: |
          # Only check pipeline layer files — research/UI tools use Claude directly by design
          VIOLATIONS=$(grep -n "Anthropic(api_key" \
            signals.py engine.py concept_rater.py zeitgeist.py orchestrator.py sandbox.py \
            2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "FAIL: Direct Anthropic() instantiation in pipeline layer:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "PASS: Pipeline layer uses security.firewall wrapper (research/UI layer exempted)"

      - name: Check threat-intel directory has no executables
        run: |
          if find security/threat-intel -type f \( -name "*.py" -o -name "*.sh" -o -name "*.js" \) | grep -q .; then
            echo "FAIL: Executable files found in threat-intel directory (reference-only)"
            exit 1
          fi
          echo "PASS: threat-intel directory contains only documentation"
